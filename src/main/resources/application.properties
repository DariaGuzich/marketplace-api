spring.application.name=marketplace-api
server.port=${PORT:8080}

# PostgreSQL (по умолчанию тот, что поднимает docker-compose из marketplace-infra)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USER:marketplace}
spring.datasource.password=${DB_PASSWORD:marketplace}

# Схему создаёт и меняет только Flyway (db/migration). Hibernate лишь проверяет,
# что сущности совпадают со схемой, и не даёт приложению стартовать, если нет
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Стабильный, читаемый openapi.json: отступы и сортировка ключей,
# чтобы git diff показывал только реальные изменения контракта
springdoc.writer-with-default-pretty-printer=true
springdoc.writer-with-order-by-keys=true
# Не приписывать ответы из @RestControllerAdvice (409) всем операциям: они описаны явно через @ApiResponse
springdoc.override-with-generic-response=false

# Optimistic locking для PUT: false — переданная клиентом version игнорируется (можно увидеть lost update).
# Одновременные записи Hibernate (@Version) защищает в любом случае.
marketplace.optimistic-locking.enabled=${OPTIMISTIC_LOCKING_ENABLED:true}
